services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mm_h3}
      POSTGRES_USER: ${POSTGRES_USER:-mm_h3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm_h3}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm_h3}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    # Needed by data migrations that touch existing media files (e.g.
    # generation/migrations/0021_backfill_video_thumbnails.py) -- without
    # this, migrate's /app/media is just an empty directory baked into the
    # image, not the real data backend/qcluster read/write, so any such
    # migration fails to find files that genuinely exist.
    volumes:
      - media_data:/app/media
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  qcluster:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
    # recover_stale_jobs first: a job left PROCESSING by a previous
    # qcluster restart would otherwise sit stuck until someone happens to
    # queue a new job (process_queue() also runs it, but only on that
    # trigger) -- see generation/tasks.py's recover_orphaned_processing_jobs().
    command: ["sh", "-c", "python manage.py recover_stale_jobs && python manage.py qcluster"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      # host:container -- container port is 8080, not 80: the frontend
      # image runs as non-root (nginxinc/nginx-unprivileged), which can't
      # bind a privileged port.
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
