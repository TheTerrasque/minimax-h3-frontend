# Single public entrypoint for the whole stack: serves the built SPA and
# reverse-proxies everything Django-owned to the backend service, so the
# browser only ever sees one origin (see ARCHITECTURE.md "Why a
# reverse-proxy-fronted stack" -- this is what makes plain session-cookie
# auth work with no CORS/JWT plumbing).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(api|accounts|admin|static|media)/ {
        # Re-resolve "backend" through Docker's embedded DNS on every
        # request (via the $backend variable) instead of once at nginx
        # startup -- otherwise, whenever the backend container gets
        # recreated (any rebuild/redeploy), its IP changes and nginx keeps
        # proxying to the old, now-dead address until nginx itself is
        # restarted. 127.0.0.11 is Docker Compose's built-in DNS server.
        resolver 127.0.0.11 valid=10s;
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
